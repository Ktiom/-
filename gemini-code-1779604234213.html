<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест по Педиатрии</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 32px;
            max-width: 620px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .text-center { text-align: center; }
        .hidden { display: none !important; }
        
        /* Экран СТАРТ */
        .icon { fontSize: 56px; font-size: 56px; margin-bottom: 16px; }
        h1 { font-size: 28px; font-weight: 700; margin: 0 0 12px; }
        p.subtitle { color: rgba(255,255,255,0.6); font-size: 15px; line-height: 1.6; margin: 0 0 32px; }
        .tags { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 32px; }
        .tag { background: rgba(99,179,237,0.15); color: #63b3ed; padding: 6px 14px; borderRadius: 20px; border-radius: 20px; font-size: 13px; }
        
        /* Главная кнопка */
        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            padding: 16px 48px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(102,126,234,0.4);
            transition: transform 0.2s;
            display: inline-block;
        }
        .btn-primary:hover { transform: scale(1.05); }

        /* Экран КВИЗ */
        .quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .quiz-count { color: rgba(255,255,255,0.5); font-size: 14px; }
        .quiz-score { color: #63b3ed; font-weight: 600; font-size: 14px; }
        .progress-bar-container { background: rgba(255,255,255,0.1); height: 4px; border-radius: 4px; margin-bottom: 20px; width: 100%; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #667eea, #764ba2); border-radius: 4px; width: 0%; transition: width 0.4s; }
        .question-text { font-size: 17px; line-height: 1.6; font-weight: 500; margin-bottom: 24px; min-height: 72px; }
        .options-list { display: flex; flex-direction: column; gap: 10px; }
        
        .option-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            color: rgba(255,255,255,0.85);
            border-radius: 12px;
            padding: 14px 18px;
            font-size: 14px;
            line-height: 1.5;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            width: 100%;
        }
        .option-btn:not(.answered):hover { background: rgba(255,255,255,0.12); }
        .option-btn span { opacity: 0.5; margin-right: 10px; }
        
        /* Состояния ответов */
        .option-btn.correct { background: rgba(72,187,120,0.2) !important; border: 1px solid #68d391 !important; color: #68d391 !important; }
        .option-btn.wrong { background: rgba(252,129,129,0.2) !important; border: 1px solid #fc8181 !important; color: #fc8181 !important; }
        
        .btn-next { width: 100%; margin-top: 20px; padding: 14px; }

        /* Экран РЕЗУЛЬТАТОВ */
        .result-title { font-size: 56px; font-weight: 800; margin: 0 0 4px; }
        .result-msg { font-size: 20px; font-weight: 600; margin: 0 0 8px; }
        .result-stats { color: rgba(255,255,255,0.5); font-size: 15px; margin: 0 0 28px; }
        .history-list { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; max-height: 400px; overflow-y: auto; padding-right: 5px; }
        
        .history-item { border-radius: 14px; padding: 16px 18px; text-align: left; }
        .history-item.is-correct { background: rgba(72,187,120,0.08); border: 1px solid rgba(104,211,145,0.3); }
        .history-item.is-wrong { background: rgba(252,129,129,0.08); border: 1px solid rgba(252,129,129,0.3); }
        .history-q { font-size: 14px; margin-bottom: 8px; font-weight: 500; color: rgba(255,255,255,0.85); }
        .history-chosen { color: #fc8181; font-size: 13px; margin-bottom: 4px; }
        .history-correct { color: #68d391; font-size: 13px; }
        
        /* Скроллбар для истории */
        .history-list::-webkit-scrollbar { width: 6px; }
        .history-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.01); border-radius: 10px; }
        .history-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <div id="start-screen" class="container text-center">
        <div class="icon">🏥</div>
        <h1>Тест по Педиатрии</h1>
        <p class="subtitle">Каждый раз — 20 случайных вопросов из 100.<br>Варианты ответов перемешаны.<br>Зазубрить не получится 😉</p>
        <div class="tags">
            <span class="tag">100 вопросов</span>
            <span class="tag">По 4 варианты</span>
            <span class="tag">Случайная выборка</span>
        </div>
        <button class="btn-primary" onclick="startQuiz()">Начать тест</button>
    </div>

    <div id="quiz-screen" class="container hidden">
        <div class="quiz-header">
            <span id="quiz-count" class="quiz-count">Вопрос 1 из 20</span>
            <span id="quiz-score" class="quiz-score">✓ 0</span>
        </div>
        <div class="progress-bar-container">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <p id="question-text" class="question-text"></p>
        <div id="options-list" class="options-list"></div>
        <button id="btn-next" class="btn-primary btn-next hidden" onclick="nextQuestion()">Следующий вопрос →</button>
    </div>

    <div id="result-screen" class="container text-center hidden">
        <div id="result-medal" class="icon">🏆</div>
        <h2 id="result-pct" class="result-title">0%</h2>
        <p id="result-msg" class="result-msg"></p>
        <p id="result-stats" class="result-stats"></p>
        <button class="btn-primary" onclick="startQuiz()">Начать заново (новые вопросы)</button>
        <div id="history-list" class="history-list"></div>
    </div>

    <script>
        // База вопросов из твоего файла
        const ALL_QUESTIONS = [
            { id: 1, q: "Что является основным предметом изучения педиатрии?", a: "Анатомо-физиологические особенности детского организма, детские болезни, их профилактика и лечение", wrong: ["Только хирургические заболевания детей", "Исключительно инфекционные болезни новорожденных", "Организация работы детских поликлиник"] },
            { id: 2, q: "На каких принципах строится педиатрическая служба в РК?", a: "Этапность и преемственность", wrong: ["Децентрализация и самофинансирование", "Стационарное лечение и отсутствие профилактики", "Только частная медицина"] },
            { id: 3, q: "Что означает аббревиатура ИВБДВ?", a: "Интегрированное ведение болезней детского возраста", wrong: ["Инфекционные вирусные болезни детей всех возрастов", "Индивидуальное ведение больных детей в больнице", "Инструментальная верификация болезней детского возраста"] },
            { id: 4, q: "На детей какого возраста направлена программа ИВБДВ?", a: "До 5 лет", wrong: ["До 1 года", "До 10 лет", "До 3 лет"] },
            { id: 5, q: "Какие заболевания охватывает программа ИВБДВ?", a: "Пневмония, диарея, малярия, корь, нарушения питания", wrong: ["Только онкологические заболевания", "Только хирургические патологии", "Только врожденные пороки развития"] },
            { id: 6, q: "Каково основное преимущество программы ИВБДВ?", a: "Системный подход, позволяющий не упустить сопутствующие патологии", wrong: ["Применяется только в стационарных условиях", "Ориентирована исключительно на лечение, без профилактики", "Используется только для детей старше 5 лет"] },
            { id: 7, q: "Что отличает универсальную усовершенствованную модель патронажа от простого медосмотра?", a: "Комплексная поддержка семьи, включая психоэмоциональное развитие и профилактику бытового насилия", wrong: ["Только измерение веса и роста ребенка", "Исключительно лечение острых заболеваний", "Только вакцинация ребенка"] },
            { id: 8, q: "Что входит в модули ЮНИСЕФ по патронажу?", a: "Вовлеченное отцовство, развитие через игру, безопасная среда, психическое здоровье матери", wrong: ["Только хирургические вмешательства", "Исключительно медикаментозное лечение", "Только диагностика инфекционных болезней"] },
            { id: 9, q: "Какова основная функция ФАПа в сельской местности?", a: "Доврачебная медицинская помощь и первичная профилактика заболеваний", wrong: ["Проведение сложных хирургических операций", "Только выдача справок и рецептов", "Исключительно стационарное лечение"] },
            { id: 10, q: "Что входит в обязанности персонала ФАПа?", a: "Прием больных, патронаж, вакцинация, санитарно-просветительская работа", wrong: ["Только выдача лекарств без осмотра", "Исключительно лечение взрослых пациентов", "Только ведение медицинской документации"] },
            { id: 11, q: "Какие основные показатели мониторируются у детей до 1 года?", a: "Масса тела, длина тела, окружность головы и грудной клетки", wrong: ["Только артериальное давление", "Только температура тела", "Только частота дыхания"] },
            { id: 12, q: "Как меняется масса тела ребенка к концу первого года жизни?", a: "Утраивается по сравнению с весом при рождении", wrong: ["Удваивается", "Увеличивается в 4 раза", "Остается почти неизменной"] },
            { id: 13, q: "На сколько сантиметров увеличивается рост ребенка за первый год жизни?", a: "На 25 сантиметров", wrong: ["На 10 сантиметров", "На 15 сантиметров", "На 35 сантиметров"] },
            { id: 14, q: "С помощью чего оценивают физическое развитие детей до года?", a: "Центильных таблиц или графиков роста ВОЗ", wrong: ["Только визуального осмотра", "Исключительно биохимических анализов", "Рентгенографии костей"] },
            { id: 15, q: "Когда заканчивается период новорожденности?", a: "На 28-й день жизни", wrong: ["На 7-й день жизни", "На 3-й месяц жизни", "На 14-й день жизни"] },
            { id: 16, q: "Какой период жизни ребенка длится от 1 года до 3 лет?", a: "Преддошкольный (ясельный) период", wrong: ["Период грудного возраста", "Дошкольный период", "Пубертатный период"] },

            { id: 19, q: "К какому возрасту должны угасать безусловные врожденные рефлексы?", a: "К 3–4 месяцам", wrong: ["К 1 месяцу", "К 12 месяцам", "К 6–8 месяцам"] },
            { id: 20, q: "Что такое НПР?", a: "Нервно-психическое развитие — показатель созревания ЦНС, включающий моторику, речь, сенсорные реакции и социальные навыки", wrong: ["Нейрохирургическое программирование ребенка", "Только физическое развитие ребенка", "Исключительно развитие речи"] },
            { id: 21, q: "В каком направлении развивается моторика у детей?", a: "Цефалокаудальном (от головы к ногам) и проксимодистальном (от центра к периферии)", wrong: ["От ног к голове и от периферии к центру", "Хаотично, без закономерностей", "Одновременно во всех направлениях"] },
            { id: 22, q: "В каком возрасте ребенок обычно делает первые самостоятельные шаги?", a: "К 12 месяцам", wrong: ["К 6 месяцам", "К 18 месяцам", "К 9 месяцам"] },
            { id: 23, q: "Что обеспечивает бурая жировая ткань у новорожденных?", a: "Теплопродукцию без дрожания", wrong: ["Запас питательных веществ на несколько месяцев", "Выработку гормонов роста", "Иммунную защиту"] },
            { id: 24, q: "Что такое семиотика поражений кожи у детей?", a: "Первичные элементы (пятна, папулы, везикулы, пустулы) и вторичные (чешуйки, корки, эрозии)", wrong: ["Только хирургические травмы кожи", "Исключительно аллергические высыпания", "Только ожоги и обморожения"] },
            { id: 25, q: "Почему инфекция у детей быстро распространяется через лимфатическую систему?", a: "Из-за высокой проницаемости лимфатических сосудов", wrong: ["Из-за сниженного иммунитета", "Из-за отсутствия лимфатических узлов", "Из-за недостаточного кровоснабжения"] },
            { id: 26, q: "К какому возрасту лимфоузлы достигают пика барьерной функции?", a: "К 7–10 годам", wrong: ["К 1 году", "К 3 годам", "К 14–16 годам"] },
            { id: 27, q: "Что содержит грудное молоко для иммунной защиты ребенка?", a: "Иммуноглобулины, лактоферрин и живые лейкоциты", wrong: ["Только витамины и минералы", "Исключительно жиры и белки", "Только углеводы и воду"] },
            { id: 28, q: "Сколько принципов успешного грудного вскармливания выделяет ВОЗ?", a: "10 принципов", wrong: ["5 принципов", "7 принципов", "15 принципов"] },
            { id: 29, q: "Какой объем пищи нужен ребенку от 4 до 6 месяцев (объемный метод)?", a: "1/7 от массы тела", wrong: ["1/5 от массы тела", "1/10 от массы тела", "1/3 от массы тела"] },
            { id: 30, q: "Каков максимальный суточный объем пищи для детей 1-го года жизни?", a: "1000–1100 мл", wrong: ["500–600 мл", "1500–2000 мл", "700–800 мл"] },

            { id: 43, q: "Как называется самая тяжелая форма ГБН?", a: "Отечная форма", wrong: ["Желтушная форма", "Анемическая форма", "Ядерная желтуха"] },
            { id: 44, q: "Какое лечение используется при тяжелой ГБН?", a: "Операция заменного переливания крови (ОЗПК)", wrong: ["Только фототерапия", "Только антибиотики", "Глюкокортикоиды"] },
            { id: 45, q: "Какие костные изменения характерны для рахита?", a: "«Рахитические четки» на ребрах, размягчение краев родничка, искривление ног (О- или Х-образное)", wrong: ["Переломы длинных трубчатых костей", "Сращение костей черепа", "Укорочение нижних конечностей"] },

        let questions = [];

        let results = [];

        function shuffle(arr) {
            return [...arr].sort(() => Math.random() - 0.5);
        }

        function getQuizSet(count = 20) {
            const shuffled = shuffle(ALL_QUESTIONS);
            return shuffled.slice(0, count).map(q => {
                const options = shuffle([q.a, ...q.wrong]);
                return { ...q, options };
            });
        }

        function startQuiz() {
            questions = getQuizSet(20);
            current = 0;
            score = 0;
            answered = false;
            results = [];

            document.getElementById("start-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.add("hidden");
            document.getElementById("quiz-screen").classList.remove("hidden");

            renderQuestion();
        }

        function renderQuestion() {
            answered = false;
            const q = questions[current];
            
            document.getElementById("quiz-count").innerText = `Вопрос ${current + 1} из ${questions.length}`;
            document.getElementById("quiz-score").innerText = `✓ ${score}`;
            document.getElementById("progress-bar").style.width = `${((current + 1) / questions.length) * 100}%`;
            document.getElementById("question-text").innerText = q.q;
            document.getElementById("btn-next").classList.add("hidden");

            const optionsList = document.getElementById("options-list");
            optionsList.innerHTML = "";

            q.options.forEach((opt, i) => {
                const btn = document.createElement("button");
                btn.className = "option-btn";
                btn.innerHTML = `<span>${String.fromCharCode(65 + i)})</span>`;
                btn.appendChild(document.createTextNode(opt));
                btn.onclick = () => pickOption(opt, btn);
                optionsList.appendChild(btn);
            });
        }

        function pickOption(opt, clickedBtn) {
            if (answered) return;
            answered = true;

            const q = questions[current];
            const isCorrect = opt === q.a;

            if (isCorrect) {
                score++;
                clickedBtn.classList.add("correct");
            } else {
                clickedBtn.classList.add("wrong");
                // Подсвечиваем правильный, раз пользователь ошибся
                Array.from(document.querySelectorAll(".option-btn")).forEach(btn => {
                    if (btn.innerText.substring(3) === q.a) {
                        btn.classList.add("correct");
                    }
                });
            }

            // Добавляем класс answered ко всем, чтобы убрать эффект ховера
            document.querySelectorAll(".option-btn").forEach(btn => btn.classList.add("answered"));

            results.push({ q: q.q, chosen: opt, correct: q.a, isCorrect: isCorrect });
            
            const nextBtn = document.getElementById("btn-next");
            nextBtn.innerText = current + 1 >= questions.length ? "Посмотреть результат →" : "Следующий вопрос →";
            nextBtn.classList.remove("hidden");
            document.getElementById("quiz-score").innerText = `✓ ${score}`;
        }

                showResults();
            } else {
                current++;
                renderQuestion();
            }
        }

        function showResults() {
            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");

            const pct = Math.round((score / questions.length) * 100);
            
            const medal = pct >= 90 ? "🏆" : pct >= 70 ? "🥈" : pct >= 50 ? "🥉" : "📚";
            const msg = pct >= 90 ? "Отлично! Ты готов к экзамену!" : pct >= 70 ? "Хороший результат!" : pct >= 50 ? "Неплохо, но есть над чем работать" : "Нужно ещё поучиться";
            const clr = pct >= 90 ? "#68d391" : pct >= 70 ? "#63b3ed" : pct >= 50 ? "#f6e05e" : "#fc8181";

            document.getElementById("result-medal").innerText = medal;
            document.getElementById("result-pct").innerText = `${pct}%`;
            document.getElementById("result-pct").style.color = clr;
            document.getElementById("result-msg").innerText = msg;
            document.getElementById("result-stats").innerText = `Правильных: ${score} из ${questions.length}`;

            const historyList = document.getElementById("history-list");
            historyList.innerHTML = "";

            results.forEach((r, i) => {
                const item = document.createElement("div");
                item.className = `history-item ${r.isCorrect ? 'is-correct' : 'is-wrong'}`;
                
                let html = `<p class="history-q">${i + 1}. ${r.q}</p>`;
                if (!r.isCorrect) {
                    html += `<p class="history-chosen">✗ Ваш ответ: ${r.chosen}</p>`;
                }
                html += `<p class="history-correct">✓ ${r.correct}</p>`;
                
                item.innerHTML = html;
                historyList.appendChild(item);
            });
        }
    </script>
</body>
</html>
